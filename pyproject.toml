[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-augmented-generation-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

[project.scripts]
retrieval-augmented-generation-claim-audit = "retrieval_augmented_generation_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["retrieval_augmented_generation_claim_audit*"]
